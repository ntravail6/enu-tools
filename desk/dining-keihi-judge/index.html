<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="飲食代が経費になるかをいくつかの質問で診断します。個人事業主向け。">
<title>飲食代経費診断</title>

<!-- iOS / PWA（JS で --bg から動的設定） -->
<link rel="icon" type="image/svg+xml" id="favicon-link">
<meta name="theme-color" content="#f5f0eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="飲食代経費診断">
<link rel="apple-touch-icon" id="apple-touch-icon" href="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
/* ===== カラーパレット：ローズ系 ===== */
:root {
  --primary:      #c0666a;
  --primary-light:#f3d0d2;
  --primary-dark: #9a5055;
  --primary-soft: #fff8f8;
  --accent:       #c0666a;
  --card:         #fff;
  --text:         #2C2A24;
  --sub:          #7A756B;
  --bg:           #f5f0eb;
  --bg-soft:      #f0ebe4;
  --line:         #e8e2dd;
  --ok-bg:        #e8f5ec;
  --ok-fg:        #1f6e36;
  --ng-bg:        #fde9e9;
  --ng-fg:        #b52929;
  --caution-bg:   #fff8e6;
  --caution-fg:   #8a5c00;
  --caution-line: #f0d896;
  --shadow:       0 2px 10px rgba(0,0,0,.06);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  padding:
    max(16px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
}

.wrap{ width:100%; max-width:720px; margin:0 auto; display:flex; flex-direction:column; min-height:100%; }

/* ===== ヘッダー ===== */
.app-header{ text-align:center; padding:18px 0 6px; }
.app-header .badge{
  display:inline-block; font-size:.72rem; font-weight:600; letter-spacing:.08em;
  color:var(--primary-dark); background:var(--primary-soft);
  border-radius:999px; padding:4px 14px; margin-bottom:10px;
}
.app-header h1{ color:var(--primary-dark); font-size:1.5rem; font-weight:700; letter-spacing:.02em; }
.app-header h1 .sub{ display:block; font-size:.86rem; font-weight:600; color:var(--sub); margin-top:6px; letter-spacing:.04em; }

/* ===== ウェルカム ===== */
.welcome-screen{ text-align:center; padding-top:8px; }
.welcome-icon{
  width:88px; height:88px; border-radius:50%;
  background:linear-gradient(135deg,var(--primary-light),var(--primary));
  display:flex; align-items:center; justify-content:center;
  font-size:42px; line-height:1; margin:8px auto 16px;
  box-shadow:0 6px 18px rgba(192,102,106,.28);
}
.welcome-title{ font-size:1.75rem; font-weight:700; color:var(--primary-dark); letter-spacing:.02em; }
.welcome-tagline{ font-size:.95rem; color:var(--sub); margin-top:8px; white-space:pre-line; }
.welcome-card{
  max-width:440px; margin:20px auto 0;
  background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:20px; box-shadow:var(--shadow); text-align:left;
}
.welcome-card h3{ font-size:.95rem; color:var(--primary-dark); margin-bottom:12px; text-align:center; }
.welcome-features{ list-style:none; display:flex; flex-direction:column; gap:10px; }
.welcome-features li{
  display:flex; gap:10px; align-items:flex-start; font-size:.88rem;
  background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:11px 13px;
}
.welcome-features li .fi{ flex:0 0 auto; }
.welcome-actions{ max-width:440px; margin:0 auto; }

/* ===== enu-notice（101仕様） ===== */
.enu-notice-area{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.enu-notice-wrap{width:100%}
.enu-notice-wrap.is-mini{width:auto}
.enu-notice-wrap>.enu-notice{display:flex}
.enu-notice-wrap>.enu-notice-mini{display:none}
.enu-notice-wrap.is-mini>.enu-notice{display:none}
.enu-notice-wrap.is-mini>.enu-notice-mini{display:inline-flex}
.enu-notice{font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;border-radius:10px;padding:11px 14px;font-size:.78rem;line-height:1.75;gap:8px;align-items:flex-start;border:1px solid}
.enu-notice .enu-icon{font-size:.95rem;line-height:1.4;flex-shrink:0}
.enu-notice .enu-body{flex:1;min-width:0}
.enu-notice .enu-close-btn{font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;flex-shrink:0;background:transparent;border:none;cursor:pointer;font-size:1rem;line-height:1;padding:4px 6px;margin:-4px -6px -4px 0;opacity:.45;color:inherit;transition:opacity .15s}
.enu-notice .enu-close-btn:hover{opacity:1}
.enu-notice-mini{font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;width:30px;height:30px;border-radius:50%;border:1px solid;cursor:pointer;font-size:.85rem;line-height:1;padding:0;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.enu-notice-mini:hover{transform:scale(1.08);box-shadow:0 1px 4px rgba(0,0,0,.10)}
.enu-notice-info,.enu-notice-mini-info{background:#eef4f9;border-color:#c5d8ea;color:#355a7a}
.enu-notice-warn,.enu-notice-mini-warn{background:#fef6df;border-color:#f0d896;color:#8a5a14}
.enu-notice-disclaim,.enu-notice-mini-disclaim{background:#faecec;border-color:#e8c8c8;color:#804a52}
.enu-notice-date,.enu-notice-mini-date{background:#f5f1e8;border-color:#e0d6bf;color:#6b5a3d}
.enu-notice-help,.enu-notice-mini-help{background:#eef2ec;border-color:#c8d3c1;color:#4a5d44}
.enu-notice-help .enu-help-link{font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;color:#344230;text-decoration:underline;text-underline-offset:2px;font-weight:700;font-size:.78rem;margin-left:2px}
.enu-notice-help .enu-help-link:hover{color:#1f2c1c}
.enu-notice strong{font-weight:700}

/* ===== カード・画面共通 ===== */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:20px; box-shadow:var(--shadow); margin:14px 0;
}
.screen{ animation:fade .3s ease; }
@keyframes fade{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* ===== ボタン ===== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; cursor:pointer; font-family:inherit; font-weight:600; font-size:.95rem;
  border-radius:999px; padding:12px 26px;
  transition:background .18s,color .18s,border-color .18s,transform .08s;
}
.btn:active{ transform:scale(.98); }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); }
.btn-soft{ background:var(--primary-soft); color:var(--primary-dark); }
.btn-soft:hover{ background:var(--primary-light); }
.btn-ghost{
  background:transparent; color:var(--sub); border:1px solid var(--sub); font-weight:600;
  padding:7px 16px; font-size:.75rem;
}
.btn-ghost:hover{ color:var(--primary-dark); border-color:var(--primary-dark); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-block{ display:flex; width:100%; }
.mt16{ margin-top:16px; }
.mt12{ margin-top:12px; }

/* ===== 進捗バー ===== */
.progress-head{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:.78rem; color:var(--sub); margin-bottom:8px; font-weight:600;
}
.progress-track{ height:8px; background:var(--primary-light); border-radius:999px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--primary); border-radius:999px; width:0; transition:width .35s ease; }

/* ===== 質問・選択肢 ===== */
.q-text{ font-size:1.1rem; font-weight:700; margin:18px 0 16px; line-height:1.55; color:var(--text); }
.opt-list{ display:flex; flex-direction:column; gap:10px; }
.opt{
  text-align:left; width:100%; background:var(--bg-soft);
  border:1.5px solid var(--line); border-radius:12px; padding:14px 16px;
  font-family:inherit; font-size:.92rem; color:var(--text); cursor:pointer;
  transition:border-color .15s,background .15s,transform .08s;
  display:flex; align-items:center; gap:12px;
}
.opt:hover{ border-color:var(--primary); background:var(--primary-soft); }
.opt:active{ transform:scale(.98); }
.opt .opt-icon{ font-size:1.2rem; flex:0 0 auto; }
.q-back{ margin-top:16px; }

/* ===== 結果カード ===== */
.result-card{
  text-align:center;
  background:linear-gradient(160deg,var(--primary-soft),var(--card));
  border:1px solid var(--primary-light);
}
.result-emoji{ font-size:2.8rem; line-height:1; margin-bottom:8px; }
.result-status-badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 14px; border-radius:999px; font-size:.72rem; font-weight:700;
  letter-spacing:.06em; margin-bottom:10px;
}
.badge-ok{ background:var(--ok-bg); color:var(--ok-fg); }
.badge-ng{ background:var(--ng-bg); color:var(--ng-fg); }
.result-cat{ font-size:1.5rem; font-weight:700; color:var(--primary-dark); margin-bottom:4px; }
.result-reason{ font-size:.8rem; color:var(--sub); margin-bottom:14px; }
.result-tip{
  text-align:left; background:var(--bg-soft); border:1px solid var(--line);
  border-radius:12px; padding:14px 16px; font-size:.88rem; margin-bottom:12px;
}
.tip-title{
  font-weight:700; font-size:.8rem; color:var(--primary-dark);
  margin-bottom:6px; display:flex; align-items:center; gap:6px;
}
.result-caution{
  text-align:left; background:var(--caution-bg); border:1px solid var(--caution-line);
  border-radius:12px; padding:14px 16px; font-size:.85rem; color:var(--caution-fg);
  margin-bottom:12px; display:flex; gap:8px; align-items:flex-start;
}
.result-no-receipt{
  text-align:left; background:var(--ng-bg); border:1px solid var(--primary-light);
  border-radius:12px; padding:14px 16px; font-size:.85rem; color:var(--ng-fg);
  margin-bottom:12px; display:flex; gap:8px; align-items:flex-start;
}
.result-ref{
  font-size:.74rem; color:var(--sub); line-height:1.7;
  background:var(--bg-soft); border:1px dashed var(--line);
  border-radius:10px; padding:10px 12px; text-align:left; margin:14px 0;
}
.result-ref-link{
  color:var(--primary-dark); text-decoration:underline; text-underline-offset:2px;
  font-weight:600; transition:color .15s;
}
.result-ref-link:hover{ color:var(--primary); }
.result-actions{ margin-top:16px; display:flex; flex-direction:column; gap:10px; }

/* ===== 履歴ログ ===== */
.log-area{ display:flex; flex-direction:column; gap:8px; margin-top:4px; margin-bottom:4px; }
.log-item{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:11px 14px; display:flex; align-items:center; gap:10px; font-size:.78rem; color:var(--text);
}
.log-date{ font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif; font-size:.68rem; color:var(--sub); flex-shrink:0; }
.log-cat{ font-weight:700; flex-shrink:0; color:var(--primary); }
.log-memo{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--sub); }
.log-amt{ font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif; font-weight:700; flex-shrink:0; }
.log-del{ background:none; border:none; cursor:pointer; color:var(--primary); opacity:.45; font-size:.85rem; padding:0 2px; flex-shrink:0; transition:opacity .15s; }
.log-del:hover{ opacity:1; }
.log-total{ display:flex; justify-content:space-between; align-items:center; padding:9px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; font-size:.78rem; margin-top:2px; }
.log-total .total-label{ color:var(--sub); }
.log-total .total-val{ font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif; font-weight:700; color:var(--text); }
.log-filter{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.filter-btn{ font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif; font-size:.68rem; font-weight:700; padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--sub); cursor:pointer; transition:.15s; }
.filter-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

/* ===== 記録フォーム ===== */
.log-form{ display:flex; flex-direction:column; gap:9px; margin:12px 0; }
.field-wrap label{ display:block; font-size:.68rem; font-weight:700; letter-spacing:.1em; color:var(--sub); text-transform:uppercase; margin-bottom:4px; }
.field-wrap input{
  width:100%; padding:10px 13px; border:1px solid var(--line); border-radius:9px;
  font-family:inherit; font-size:.88rem; color:var(--text); outline:none;
  transition:border-color .18s; background:var(--bg-soft);
}
.field-wrap input:focus{ border-color:var(--primary); background:var(--card); }
.save-btn{
  width:100%; padding:13px; background:var(--primary); color:#fff; border:none;
  border-radius:999px; font-family:inherit; font-size:.9rem; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  gap:7px; transition:background .18s,transform .12s;
}
.save-btn:hover{ background:var(--primary-dark); }
.save-btn:active{ transform:scale(.98); }

/* ===== enu-toolbar（102仕様：grid） ===== */
.enu-fc-pdf{ background:#fef0f0;border-color:#f0c8c8;color:#804a52 }
.enu-fc-share2{ background:#e6f0fa;border-color:#abc8e3;color:#1f4d80 }
.enu-fc-json{ background:#f5f1e8;border-color:#d8cdaa;color:#6b5a3d }
.enu-btn-card{ font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 6px 11px;border-radius:10px;border:1px solid;cursor:pointer;gap:2px;transition:transform .15s }
.enu-btn-card:hover{ transform:translateY(-1px) }
.enu-btn-card .enu-icon{ font-size:1.3rem;line-height:1 }
.enu-btn-card .enu-label{ font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;font-size:.62rem;font-weight:700;text-align:center;color:inherit;line-height:1.2 }
.enu-toolbar{ display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:16px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px }

/* ===== enu-toast（z-index:3000） ===== */
.enu-toast{ position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#2d2820;color:#fff;padding:10px 18px;border-radius:999px;font-size:.78rem;font-weight:700;font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:3000;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:calc(100vw - 32px);text-align:center }
.enu-toast.show{ opacity:1;transform:translateX(-50%) translateY(0) }

/* ===== enu-confirm-modal（z-index:2500） ===== */
.enu-confirm-modal[hidden]{ display:none }
.enu-confirm-modal{ position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;padding:16px }
.enu-confirm-modal__backdrop{ position:absolute;inset:0;background:rgba(0,0,0,.45);animation:enuFade .15s ease }
.enu-confirm-modal__box{ position:relative;background:var(--card);border-radius:14px;padding:22px 22px 18px;max-width:380px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.2);font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;animation:enuUp .2s ease }
.enu-confirm-modal__title{ font-size:1rem;font-weight:700;color:var(--primary-dark);margin:0 0 10px;line-height:1.4 }
.enu-confirm-modal__desc{ font-size:.82rem;color:var(--text);margin:0 0 20px;line-height:1.65;white-space:pre-line }
.enu-confirm-modal__actions{ display:flex;gap:8px;justify-content:flex-end }
.enu-confirm-btn{ padding:9px 18px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Quicksand','Arial Rounded MT Bold','Kosugi Maru',sans-serif;transition:opacity .15s,transform .1s }
.enu-confirm-btn:hover{ transform:translateY(-1px) }
.enu-confirm-btn--cancel{ background:transparent;border:1px solid var(--line);color:var(--sub) }
.enu-confirm-btn--ok{ background:var(--primary);border:1px solid var(--primary);color:#fff }
@keyframes enuFade{ from{opacity:0}to{opacity:1} }
@keyframes enuUp{ from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }

/* ===== フッター ===== */
.app-footer{ margin-top:24px; text-align:center; }
.footer-home{ margin-bottom:12px; }
.footer-line{ border-top:1px solid color-mix(in srgb,var(--sub) 30%,transparent); margin-bottom:12px; }
.footer-credit a{ color:var(--sub);text-decoration:none;font-size:.82rem;font-weight:600; }
.footer-credit a:hover{ color:var(--primary-dark); }
.footer-copy{ margin-top:8px;font-size:.72rem;color:var(--sub); }

.hidden{ display:none !important; }

@media print{
  .enu-notice-area,.enu-toolbar,.enu-toast,.enu-confirm-modal,.app-header{ display:none !important }
}

@media(max-width:480px){
  .app-header h1{ font-size:1.25rem; }
  .welcome-title{ font-size:1.5rem; }
  .result-cat{ font-size:1.3rem; }
  .btn{ font-size:.9rem; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ヘッダー（ウェルカムでは非表示） -->
  <header class="app-header hidden" id="appHeader">
    <span class="badge">飲食代経費診断</span>
    <h1>この飲食代、経費になる？
      <span class="sub">個人事業主向け　勘定科目チェック</span>
    </h1>
  </header>

  <!-- 注意書きカード（ウェルカムでは非表示） -->
  <section class="enu-notice-area hidden" id="noticeArea">
    <div class="enu-notice-wrap" data-notice-id="info" data-storage="local">
      <div class="enu-notice enu-notice-info">
        <span class="enu-icon">💾</span>
        <span class="enu-body">診断結果はこの端末・ブラウザ内にのみ保存されます。サーバーには送信されません。</span>
        <button type="button" class="enu-close-btn" aria-label="最小化">×</button>
      </div>
      <button type="button" class="enu-notice-mini enu-notice-mini-info" aria-label="案内を表示" title="案内を表示">💾</button>
    </div>
    <div class="enu-notice-wrap" data-notice-id="warn" data-storage="local">
      <div class="enu-notice enu-notice-warn">
        <span class="enu-icon">⚠️</span>
        <span class="enu-body">ブラウザのデータ削除・他端末・シークレットモードではデータが引き継げません。重要な情報は📤 エクスポートでバックアップを推奨します。</span>
        <button type="button" class="enu-close-btn" aria-label="最小化">×</button>
      </div>
      <button type="button" class="enu-notice-mini enu-notice-mini-warn" aria-label="注意を表示" title="注意を表示">⚠️</button>
    </div>
    <div class="enu-notice-wrap" data-notice-id="disclaim">
      <div class="enu-notice enu-notice-disclaim">
        <span class="enu-icon">🚨</span>
        <span class="enu-body">本ツールの判定は一般的な目安です。実際の経費処理は社内規定や税法により異なるため、<strong>税理士にご確認ください。</strong></span>
        <button type="button" class="enu-close-btn" aria-label="最小化">×</button>
      </div>
      <button type="button" class="enu-notice-mini enu-notice-mini-disclaim" aria-label="免責事項を表示" title="免責事項を表示">🚨</button>
    </div>
    <div class="enu-notice-wrap" data-notice-id="date">
      <div class="enu-notice enu-notice-date">
        <span class="enu-icon">📅</span>
        <span class="enu-body">掲載情報は <strong>2026年3月時点</strong> のものです。最新情報は公式サイト等でご確認ください。</span>
        <button type="button" class="enu-close-btn" aria-label="最小化">×</button>
      </div>
      <button type="button" class="enu-notice-mini enu-notice-mini-date" aria-label="情報の時点を表示" title="情報の時点を表示">📅</button>
    </div>
    <div class="enu-notice-wrap" data-notice-id="help">
      <div class="enu-notice enu-notice-help">
        <span class="enu-icon">📚</span>
        <span class="enu-body">使い方・FAQ・トラブル対応は<a href="" class="enu-help-link" id="enu-help-link">こちらから</a></span>
        <button type="button" class="enu-close-btn" aria-label="最小化">×</button>
      </div>
      <button type="button" class="enu-notice-mini enu-notice-mini-help" aria-label="ヘルプを表示" title="ヘルプを表示">📚</button>
    </div>
  </section>

  <main id="main"></main>

<script>
(function(){
'use strict';

/* ===== ENU_CONFIG ===== */
var ENU_CONFIG = {
  appId:       'dining-keihi-judge',
  appName:     '飲食代経費診断',
  dataVersion: 1,
  storageType: 'local',
  helpUrl:     'https://enu-tools.pages.dev/help/',
  helpOpenNewTab: true,
  getData: function(){ return JSON.parse(localStorage.getItem('dining_logs') || '[]'); },
  applyData: function(d){ localStorage.setItem('dining_logs', JSON.stringify(d)); renderLogs(); },
  validateData: function(d){ return Array.isArray(d); }
};
var CFG = ENU_CONFIG;
var ICON_EMOJI = '🍽️';
var MAX_STEPS  = 6;

/* ===== DOM ヘルパー（innerHTML不使用） ===== */
function el(tag, opts, children){
  var node = document.createElement(tag);
  opts = opts || {};
  if(opts.cls)  node.className = opts.cls;
  if(opts.text != null) node.textContent = opts.text;
  if(opts.attrs){ for(var k in opts.attrs) node.setAttribute(k, opts.attrs[k]); }
  if(opts.on){   for(var ev in opts.on) node.addEventListener(ev, opts.on[ev]); }
  if(children) children.forEach(function(c){ if(c) node.appendChild(c); });
  return node;
}
function _key(s){ return 'enu_' + CFG.appId + '_' + s; }
function clr(node){ while(node.firstChild) node.removeChild(node.firstChild); }

var appHeader  = document.getElementById('appHeader');
var noticeArea = document.getElementById('noticeArea');
var mainEl     = document.getElementById('main');
var footerHome = document.getElementById('footerHome');

function showChrome(show){
  if(appHeader)  appHeader.classList.toggle('hidden', !show);
  if(noticeArea) noticeArea.classList.toggle('hidden', !show);
  if(footerHome) footerHome.classList.toggle('hidden', !show);
}

/* ===== 質問ツリー ===== */
var Q = {
  q_who: {
    text: '誰と飲食しましたか？',
    opts: [
      { icon:'🧍', label:'ひとりで',      next:'q_purpose' },
      { icon:'🤝', label:'客先・取引先',   next:'q_guest_type' }
    ]
  },
  q_purpose: {
    text: '目的は何ですか？',
    opts: [
      { icon:'🏠', label:'私用',  result:'private' },
      { icon:'💼', label:'仕事',  next:'q_work' }
    ]
  },
  q_work: {
    text: '仕事の内容は？',
    opts: [
      { icon:'🔬', label:'研究・視察',  receipt:'study' },
      { icon:'🖥️', label:'ひとり仕事', next:'q_online' }
    ]
  },
  q_online: {
    text: '作業の内容は？',
    opts: [
      { icon:'💻', label:'オンライン会議・通話中（取引先や顧客と）', receipt:'online_mtg', caution:true },
      { icon:'📝', label:'資料作成・企画など',                        next:'q_order' }
    ]
  },
  q_order: {
    text: '注文内容は？',
    opts: [
      { icon:'☕', label:'飲み物のみ', receipt:'drink' },
      { icon:'🍱', label:'食べ物',     result:'food' }
    ]
  },
  q_guest_type: {
    text: '内容は何でしたか？',
    opts: [
      { icon:'📋', label:'打合せ・ミーティング', next:'q_headcount' },
      { icon:'🥂', label:'接待・慰労',           receipt:'entertain' }
    ]
  },
  q_headcount: {
    text: '参加人数は？',
    opts: [
      { icon:'👥', label:'2人以上（相手と同席）',          receipt:'mtg' },
      { icon:'💻', label:'自分のみ（相手はオンライン等）', receipt:'online_guest', caution:true }
    ]
  },
  q_receipt: {
    text: '領収書・レシートはありますか？',
    opts: [
      { icon:'🧾', label:'ある',  useOk:true },
      { icon:'❌', label:'ない',  useNoReceipt:true }
    ]
  }
};

/* ===== 判定結果マップ ===== */
var RESULTS = {
  private: {
    ok:false, emoji:'❌', cat:'経費不可', reason:'私用のため',
    tip:'私用は経費計上できません。', memo:'', caution:false, noReceiptWarn:false
  },
  food: {
    ok:false, emoji:'❌', cat:'経費不可', reason:'ひとりでの食事のため',
    tip:'食事代は生活費とみなされ原則NG。飲み物と食事は領収書を分けてもらいましょう。',
    memo:'', caution:false, noReceiptWarn:false
  },
  study: {
    ok:true, emoji:'✅', cat:'雑費', catSub:'研究費・取材費も可', reason:'研究・視察目的のため',
    tip:'レシートの裏に視察・取材の目的を記載しておきましょう。',
    memo:'研究費や取材費として処理しても問題ありません。', caution:false
  },
  online_mtg: {
    ok:true, emoji:'✅', cat:'会議費', reason:'取引先とのオンライン会議中のため',
    tip:'会議の相手先・内容をレシートの裏に記載しておきましょう。',
    memo:'オンライン会議中の飲み物代は会議費として処理できると考えられます。',
    caution:true, cautionText:'オンライン会議中の会議費への計上は税理士によって見解が異なる場合があります。担当の税理士にご確認ください。'
  },
  drink: {
    ok:true, emoji:'✅', cat:'雑費', reason:'ひとり仕事中の飲み物のため',
    tip:'レシートの裏にいつ・何の仕事をしたか記載しておきましょう。',
    memo:'', caution:false
  },
  mtg: {
    ok:true, emoji:'✅', cat:'会議費', reason:'取引先との打合せ（2名以上）のため',
    tip:'誰と・何の打合せかをレシートの裏に記載。雑費・接待交際費でも可。',
    memo:'', caution:false
  },
  online_guest: {
    ok:true, emoji:'✅', cat:'会議費', reason:'取引先とのオンライン打合せのため',
    tip:'相手先名・打合せ内容をレシートの裏に記載しておきましょう。',
    memo:'自分のみが現地にいるオンライン打合せの場合も会議費として処理できると考えられます。',
    caution:true, cautionText:'自分のみが現地にいるオンライン打合せへの会議費計上は、税理士によって見解が異なる場合があります。担当の税理士にご確認ください。'
  },
  entertain: {
    ok:true, emoji:'✅', cat:'接待交際費', reason:'取引先の接待・慰労のため',
    tip:'相手の氏名・会社名・目的をレシートの裏に記載しておきましょう。',
    memo:'', caution:false
  }
};

function getResult(id){
  var noReceipt = id.endsWith('_no_receipt');
  var base = RESULTS[noReceipt ? id.slice(0, -11) : id];
  if(!base) return RESULTS.private;
  if(!noReceipt) return base;
  return Object.assign({}, base, { noReceiptWarn:true });
}

/* ===== 状態管理 ===== */
var state = {
  current:       'q_who',
  history:       [],
  pendingResult: null,
  stepCount:     0
};

/* ===== ウェルカム ===== */
function renderWelcome(){
  showChrome(false);
  clr(mainEl);
  state = { current:'q_who', history:[], pendingResult:null, stepCount:0 };

  var screen = el('div', { cls:'welcome-screen screen' });
  screen.appendChild(el('div', { cls:'welcome-icon', text:ICON_EMOJI }));
  screen.appendChild(el('div', { cls:'welcome-title', text:'飲食代経費診断' }));
  screen.appendChild(el('p',   { cls:'welcome-tagline', text:'この飲食代、経費になる？勘定科目は？\nいくつかの質問で診断します。' }));

  var card = el('div', { cls:'welcome-card' });
  card.appendChild(el('h3', { text:'診断でわかること' }));
  var ul = el('ul', { cls:'welcome-features' });
  [
    ['✅', '飲食代が経費になるかどうか'],
    ['📂', '勘定科目（会議費・雑費・接待交際費など）'],
    ['🧾', '領収書なしの場合のリスク'],
    ['💾', '診断結果を履歴として保存・管理']
  ].forEach(function(f){
    ul.appendChild(el('li', {}, [el('span',{cls:'fi',text:f[0]}), el('span',{text:f[1]})]));
  });
  card.appendChild(ul);
  screen.appendChild(card);

  var actions = el('div', { cls:'welcome-actions' });
  actions.appendChild(el('button', {
    cls:'btn btn-primary btn-block mt16', text:'診断をはじめる',
    attrs:{ type:'button' }, on:{ click:startQuiz }
  }));
  var prev = loadLastResult();
  if(prev){
    actions.appendChild(el('button', {
      cls:'btn btn-soft btn-block mt12',
      text:'前回の結果（' + prev.cat + '）を見る',
      attrs:{ type:'button' }, on:{ click:function(){ showSavedResult(prev); } }
    }));
  }
  screen.appendChild(actions);
  mainEl.appendChild(screen);
}

/* ===== 診断開始 ===== */
function startQuiz(){
  state = { current:'q_who', history:[], pendingResult:null, stepCount:0 };
  renderQuestion('q_who');
}

/* ===== 質問描画 ===== */
function renderQuestion(qid){
  showChrome(true);
  clr(mainEl);
  var qNode = Q[qid];
  if(!qNode) return;
  state.current = qid;

  var card = el('div', { cls:'card screen' });

  // 進捗バー
  var pct = Math.min(Math.round((state.stepCount / MAX_STEPS) * 100), 90);
  card.appendChild(el('div', { cls:'progress-head' }, [
    el('span', { text:'ステップ ' + (state.stepCount + 1) }),
    el('span', { text:pct + '%' })
  ]));
  var fill = el('div', { cls:'progress-fill' });
  fill.style.width = pct + '%';
  card.appendChild(el('div', { cls:'progress-track' }, [fill]));

  card.appendChild(el('div', { cls:'q-text', text:qNode.text }));

  // 選択肢
  var list = el('div', { cls:'opt-list' });
  qNode.opts.forEach(function(opt){
    var btn = el('button', {
      cls:'opt', attrs:{ type:'button' },
      on:{ click:function(){ onOptClick(opt); } }
    }, [
      el('span', { cls:'opt-icon', text:opt.icon }),
      el('span', { text:opt.label })
    ]);
    list.appendChild(btn);
  });
  card.appendChild(list);

  // 戻るボタン
  if(state.history.length > 0){
    card.appendChild(el('div', { cls:'q-back' }, [
      el('button', {
        cls:'btn btn-ghost', text:'← 戻る',
        attrs:{ type:'button' }, on:{ click:goBack }
      })
    ]));
  }

  mainEl.appendChild(card);
}

/* ===== 選択肢クリック ===== */
function onOptClick(opt){
  state.history.push({ qid:state.current, stepCount:state.stepCount });
  state.stepCount++;

  if(opt.result){
    renderResult(getResult(opt.result));
    return;
  }
  if(opt.receipt){
    state.pendingResult  = opt.receipt;
    renderQuestion('q_receipt');
    return;
  }
  if(opt.useOk){
    renderResult(getResult(state.pendingResult));
    return;
  }
  if(opt.useNoReceipt){
    renderResult(getResult(state.pendingResult + '_no_receipt'));
    return;
  }
  if(opt.next){
    renderQuestion(opt.next);
  }
}

/* ===== 戻る ===== */
function goBack(){
  if(!state.history.length) return;
  var prev = state.history.pop();
  state.stepCount = prev.stepCount;
  renderQuestion(prev.qid);
}

/* ===== 結果描画 ===== */
function renderResult(res){
  showChrome(true);
  clr(mainEl);
  saveLastResult(res);

  // 結果カード
  var card = el('div', { cls:'card result-card screen' });
  card.appendChild(el('div', { cls:'result-emoji', text:res.emoji }));

  var badge = el('span', { cls:'result-status-badge ' + (res.ok ? 'badge-ok':'badge-ng'), text:res.ok ? '経費OK' : '経費NG' });
  card.appendChild(badge);

  var catText = res.cat + (res.catSub ? '（' + res.catSub + '）' : '');
  card.appendChild(el('div', { cls:'result-cat', text:catText }));
  card.appendChild(el('div', { cls:'result-reason', text:res.reason }));

  // 領収書なし警告
  if(res.noReceiptWarn){
    card.appendChild(el('div', { cls:'result-no-receipt' }, [
      el('span', { text:'⚠️' }),
      el('span', { text:'領収書・レシートがないと、原則として経費計上はできません。必ず保管するようにしましょう。' })
    ]));
  }

  // 税理士確認バッジ
  if(res.caution && !res.noReceiptWarn){
    card.appendChild(el('div', { cls:'result-caution' }, [
      el('span', { text:'👨‍💼' }),
      el('div', {}, [
        el('div', { text:'税理士にご確認ください', attrs:{ style:'font-weight:700;margin-bottom:4px' } }),
        el('div', { text:res.cautionText || 'この判定は税理士によって見解が異なる場合があります。担当の税理士にご確認ください。' })
      ])
    ]));
  }

  // アドバイス
  if(res.ok){
    var tipBox = el('div', { cls:'result-tip' });
    tipBox.appendChild(el('div', { cls:'tip-title' }, [
      el('span', { text:'📝' }), el('span', { text:'記録のポイント' })
    ]));
    tipBox.appendChild(el('div', { text:res.tip }));
    if(res.memo) tipBox.appendChild(el('div', { text:res.memo, attrs:{ style:'margin-top:6px;color:var(--sub);font-size:.82rem' } }));
    card.appendChild(tipBox);
  } else {
    card.appendChild(el('div', { cls:'result-tip' }, [
      el('div', { cls:'tip-title' }, [el('span',{text:'📝'}), el('span',{text:'ポイント'})]),
      el('div', { text:res.tip })
    ]));
  }

  // 参考情報はカード外に追加（mainEl直下）

  // 記録フォーム（OKのみ）
  if(res.ok){
    var memoInput = el('input', { attrs:{ type:'text', placeholder:'例）〇〇カフェ・ランチMTG' } });
    var amtInput  = el('input', { attrs:{ type:'number', placeholder:'例）1200' } });
    var fwm = el('div', { cls:'field-wrap' });
    fwm.appendChild(el('label', { text:'メモ（店名・相手先など）' }));
    fwm.appendChild(memoInput);
    var fwa = el('div', { cls:'field-wrap' });
    fwa.appendChild(el('label', { text:'金額（円）' }));
    fwa.appendChild(amtInput);
    var saveBtn = el('button', {
      cls:'save-btn', attrs:{ type:'button' },
      on:{ click:function(){ doSave(res.cat, memoInput.value, amtInput.value); } }
    }, [ el('span',{text:'💾'}), el('span',{text:'記録する'}) ]);
    var form = el('div', { cls:'log-form' });
    form.appendChild(fwm);
    form.appendChild(fwa);
    form.appendChild(saveBtn);
    card.appendChild(form);
  }

  card.appendChild(el('div', { cls:'result-actions' }, [
    el('button', { cls:'btn btn-primary btn-block', text:'もう一度診断する', attrs:{ type:'button' }, on:{ click:startQuiz } }),
    el('button', { cls:'btn btn-ghost btn-block mt12', text:'最初に戻る', attrs:{ type:'button' }, on:{ click:renderWelcome } })
  ]));

  mainEl.appendChild(card);

  // 参考情報（カード外・リンク埋め込み）
  var refDiv = el('div', { cls:'result-ref' });
  refDiv.appendChild(document.createTextNode('参考：'));
  refDiv.appendChild(el('a', {
    cls:'result-ref-link',
    text:'マネーフォワード「個人事業主はカフェ代を経費にできる？」',
    attrs:{ href:'https://biz.moneyforward.com/tax_return/basic/78585/', target:'_blank', rel:'noopener' }
  }));
  refDiv.appendChild(document.createTextNode('（2026年3月時点）'));
  mainEl.appendChild(refDiv);

  // 履歴ログ
  var logSection = el('div', { cls:'card screen' });
  logSection.appendChild(el('div', { cls:'tip-title', attrs:{ style:'margin-bottom:12px' } }, [
    el('span',{text:'📋'}), el('span',{text:'診断・記録の履歴'})
  ]));
  var logArea = el('div', { attrs:{ id:'log-area' } });
  logSection.appendChild(logArea);
  mainEl.appendChild(logSection);
  renderLogs();

  // ツールバー
  var toolbar = el('div', { cls:'enu-toolbar' });
  [
    { id:'enu-btn-print',  cls:'enu-fc-pdf',   icon:'📄', label:'PDF / 印刷' },
    { id:'enu-btn-share2', cls:'enu-fc-share2', icon:'🔗', label:'シェア' },
    { id:'enu-btn-export', cls:'enu-fc-json',   icon:'📤', label:'エクスポート' },
    { id:'enu-btn-import', cls:'enu-fc-json',   icon:'📥', label:'インポート' }
  ].forEach(function(b){
    toolbar.appendChild(el('button', {
      cls:'enu-btn-card ' + b.cls, attrs:{ type:'button', id:b.id, 'aria-label':b.label }
    }, [
      el('span',{cls:'enu-icon',text:b.icon}),
      el('span',{cls:'enu-label',text:b.label})
    ]));
  });
  mainEl.appendChild(toolbar);

  // ツールバーイベント再バインド（DOM再生成のため）
  initToolbarButtons();
}

/* ===== 記録保存 ===== */
function doSave(cat, memo, amt){
  if(!amt){ toast('⚠️ 金額を入力してください'); return; }
  var logs = JSON.parse(localStorage.getItem('dining_logs') || '[]');
  logs.unshift({ d: new Date().toLocaleDateString(), c: cat, m: memo || '未入力', a: amt });
  localStorage.setItem('dining_logs', JSON.stringify(logs));
  renderLogs();
  toast('💾 記録しました');
}

/* ===== 履歴描画 ===== */
var currentFilter = '全て';

function renderLogs(){
  var area = document.getElementById('log-area');
  if(!area) return;
  var logs = JSON.parse(localStorage.getItem('dining_logs') || '[]');
  clr(area);
  if(!logs.length){ area.appendChild(el('div',{text:'まだ記録がありません',attrs:{style:'font-size:.8rem;color:var(--sub);text-align:center;padding:12px 0'}})); return; }

  var cats     = Array.from(new Set(logs.map(function(l){ return l.c; })));
  var filtered = currentFilter === '全て' ? logs : logs.filter(function(l){ return l.c === currentFilter; });
  var total    = filtered.reduce(function(s,l){ return s + Number(l.a); }, 0);

  var wrapper = el('div', { cls:'log-area' });

  var filterDiv = el('div', { cls:'log-filter' });
  ['全て'].concat(cats).forEach(function(c){
    var btn = el('button', {
      cls:'filter-btn' + (c === currentFilter ? ' active':''), text:c,
      on:{ click:function(){ currentFilter = c; renderLogs(); } }
    });
    filterDiv.appendChild(btn);
  });
  wrapper.appendChild(filterDiv);

  filtered.forEach(function(l, idx){
    var ri = logs.indexOf(l);
    var item = el('div', { cls:'log-item' });
    var d  = el('span',{cls:'log-date',text:l.d});
    var c  = el('span',{cls:'log-cat', text:l.c});
    var m  = el('span',{cls:'log-memo',text:l.m});
    var a  = el('span',{cls:'log-amt', text:'¥'+Number(l.a).toLocaleString()});
    var delbtn = el('button',{cls:'log-del',text:'🗑',attrs:{title:'削除'},on:{click:function(){ deleteLog(ri); }}});
    item.append(d,c,m,a,delbtn);
    wrapper.appendChild(item);
  });

  var tot = el('div',{cls:'log-total'},[
    el('span',{cls:'total-label',text:currentFilter==='全て'?'合計':currentFilter+' 合計'}),
    el('span',{cls:'total-val',  text:'¥'+total.toLocaleString()})
  ]);
  wrapper.appendChild(tot);
  area.appendChild(wrapper);
}

async function deleteLog(index){
  var ok = await enuConfirm('記録の削除','この記録を削除しますか？\n元に戻すことはできません。','削除','キャンセル');
  if(!ok) return;
  var logs = JSON.parse(localStorage.getItem('dining_logs') || '[]');
  logs.splice(index, 1);
  localStorage.setItem('dining_logs', JSON.stringify(logs));
  if(currentFilter !== '全て' && !logs.filter(function(l){ return l.c === currentFilter; }).length) currentFilter = '全て';
  renderLogs();
  toast('🗑 削除しました');
}

/* ===== 前回結果の保存・読み込み ===== */
function saveLastResult(res){
  try{ localStorage.setItem(_key('last'), JSON.stringify({ cat:res.cat, ok:res.ok, at:new Date().toISOString() })); }catch(e){}
}
function loadLastResult(){
  try{ var r = JSON.parse(localStorage.getItem(_key('last'))||'null'); return r; }catch(e){ return null; }
}
function showSavedResult(prev){
  var r = Object.assign({}, prev, {
    emoji: prev.ok ? '✅' : '❌',
    reason: '前回の診断結果',
    tip: '詳細はもう一度診断してご確認ください。',
    memo: '', caution:false, noReceiptWarn:false
  });
  renderResult(r);
}

/* ===== toast & enuConfirm ===== */
function toast(msg){
  var t = document.getElementById('enu-toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

function enuConfirm(title, desc, okLabel, cancelLabel){
  okLabel     = okLabel     || 'OK';
  cancelLabel = cancelLabel || 'キャンセル';
  return new Promise(function(resolve){
    var modal    = document.getElementById('enu-confirm-modal');
    if(!modal){ resolve(window.confirm(title + '\n\n' + desc)); return; }
    modal.querySelector('.enu-confirm-modal__title').textContent = title;
    modal.querySelector('.enu-confirm-modal__desc').textContent  = desc;
    var ok       = modal.querySelector('.enu-confirm-btn--ok');
    var cancel   = modal.querySelector('.enu-confirm-btn--cancel');
    var backdrop = modal.querySelector('.enu-confirm-modal__backdrop');
    ok.textContent = okLabel; cancel.textContent = cancelLabel;
    modal.hidden = false;
    setTimeout(function(){ cancel.focus(); }, 50);
    function cleanup(result){
      modal.hidden = true;
      ok.removeEventListener('click', onOk);
      cancel.removeEventListener('click', onCancel);
      backdrop.removeEventListener('click', onCancel);
      document.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    function onKey(e){ if(e.key==='Escape') onCancel(); if(e.key==='Enter') onOk(); }
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
    backdrop.addEventListener('click', onCancel);
    document.addEventListener('keydown', onKey);
  });
}

window.enuTools         = window.enuTools || {};
window.enuTools.toast   = toast;
window.enuTools.confirm = enuConfirm;

/* ===== ツールバー ===== */
function initToolbarButtons(){
  var btnPrint  = document.getElementById('enu-btn-print');
  var btnShare  = document.getElementById('enu-btn-share2');
  var btnExport = document.getElementById('enu-btn-export');
  var btnImport = document.getElementById('enu-btn-import');
  if(btnPrint)  btnPrint.addEventListener('click',  function(){ window.print(); });
  if(btnShare)  btnShare.addEventListener('click',  handleShare);
  if(btnExport) btnExport.addEventListener('click', handleExport);
  if(btnImport) btnImport.addEventListener('click', handleImport);
}
async function handleShare(){
  var d = { title:document.title, text:document.title+'を共有します', url:location.href };
  if(navigator.share){ try{ await navigator.share(d); }catch(e){} }
  else{ try{ await navigator.clipboard.writeText(location.href); toast('🔗 URLをコピーしました'); }catch(e){ toast('共有に対応していない環境です'); } }
}
function handleExport(){
  var payload = { app_id:CFG.appId, app_name:CFG.appName, data_version:CFG.dataVersion, storage_type:CFG.storageType, exported_at:new Date().toISOString(), data:CFG.getData() };
  var blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a'); a.href=url; a.download='飲食代経費診断_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('📤 JSONをダウンロードしました');
}
async function handleImport(){
  var input = document.createElement('input'); input.type='file'; input.accept='application/json,.json';
  input.addEventListener('change', async function(e){
    var f = e.target.files[0]; if(!f) return;
    try{
      var p = JSON.parse(await f.text());
      if(!p || typeof p !== 'object') throw new Error('JSONの形式が不正です');
      if(p.app_id && p.app_id !== CFG.appId) throw new Error('別アプリのファイルです（'+p.app_id+'）');
      if(p.data_version > (CFG.dataVersion||1)) throw new Error('新しいバージョンのファイルです');
      var d = p.data !== undefined ? p.data : p;
      if(!CFG.validateData(d)) throw new Error('データ形式が違います');
      var ok = await enuConfirm('📥 データのインポート', (p.app_name||CFG.appName)+'のデータをインポートします。\n現在のデータは上書きされます。元に戻せません。', 'インポート','キャンセル');
      if(!ok) return;
      CFG.applyData(d); toast('📥 インポートしました');
    }catch(err){ toast('⚠️ '+(err.message||'ファイルが読み込めません')); }
  });
  input.click();
}

/* ===== notice IIFE ===== */
(function(){
  var KEY  = _key('notice_minimized');
  var help = document.getElementById('enu-help-link');
  if(help){ help.href=CFG.helpUrl; help.target='_blank'; help.rel='noopener'; }
  function get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
  function save(l){ try{ localStorage.setItem(KEY,JSON.stringify(l)); }catch(e){} }
  get().forEach(function(id){ var w=document.querySelector('.enu-notice-wrap[data-notice-id="'+id+'"]'); if(w) w.classList.add('is-mini'); });
  document.querySelectorAll('.enu-notice-wrap .enu-close-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var w=b.closest('.enu-notice-wrap'), id=w.dataset.noticeId;
      w.classList.add('is-mini');
      var l=get(); if(l.indexOf(id)===-1){ l.push(id); save(l); }
    });
  });
  document.querySelectorAll('.enu-notice-mini').forEach(function(m){
    m.addEventListener('click', function(){
      var w=m.closest('.enu-notice-wrap'), id=w.dataset.noticeId;
      w.classList.remove('is-mini');
      save(get().filter(function(x){ return x!==id; }));
    });
  });
})();

/* ===== PWA icons（003仕様） ===== */
(function(){
  function init(){
    document.fonts.ready.then(async function(){
      var BG   = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#faf7f0';
      var FONT = "'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif";
      var EMJ  = ICON_EMOJI;

      // favicon
      var svgSrc = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>"
        + "<rect width='100' height='100' rx='22' fill='" + BG + "'/>"
        + "<text x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='central' "
        + "font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,Twemoji Mozilla,sans-serif'>"
        + EMJ + "</text></svg>";
      var fav = document.getElementById('favicon-link') || document.querySelector('link[rel="icon"]');
      if(!fav){ fav=document.createElement('link'); fav.rel='icon'; fav.type='image/svg+xml'; document.head.appendChild(fav); }
      fav.href = 'data:image/svg+xml,' + encodeURIComponent(svgSrc);

      function makeAny(size){ return new Promise(function(resolve){
        var c=document.createElement('canvas'); c.width=c.height=size;
        var ctx=c.getContext('2d'); var r=size*0.22;
        ctx.beginPath(); ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r); ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r); ctx.closePath();
        ctx.fillStyle=BG; ctx.fill();
        ctx.font=size*0.55+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(EMJ,size/2,size/2+size*0.025);
        resolve(c.toDataURL('image/png'));
      }); }
      function makeMaskable(size){ return new Promise(function(resolve){
        var c=document.createElement('canvas'); c.width=c.height=size;
        var ctx=c.getContext('2d');
        ctx.fillStyle=BG; ctx.fillRect(0,0,size,size);
        ctx.font=size*0.50+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(EMJ,size/2,size/2+size*0.025);
        resolve(c.toDataURL('image/png'));
      }); }

      var at = document.getElementById('apple-touch-icon');
      if(at) at.href = await makeAny(180);

      var urls = await Promise.all([makeAny(192),makeMaskable(192),makeAny(512),makeMaskable(512)]);
      var path = location.pathname;
      var manifest = {
        id:path, name:CFG.appName, short_name:'飲食代経費診断',
        start_url:path, scope:path, display:'standalone', orientation:'portrait',
        background_color:BG, theme_color:BG,
        icons:[
          {src:urls[0],sizes:'192x192',type:'image/png',purpose:'any'},
          {src:urls[1],sizes:'192x192',type:'image/png',purpose:'maskable'},
          {src:urls[2],sizes:'512x512',type:'image/png',purpose:'any'},
          {src:urls[3],sizes:'512x512',type:'image/png',purpose:'maskable'}
        ]
      };
      var ml = document.querySelector('link[rel="manifest"]');
      if(!ml){ ml=document.createElement('link'); ml.rel='manifest'; document.head.appendChild(ml); }
      ml.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    });
  }
  if(document.readyState!=='loading'){ init(); }
  else{ document.addEventListener('DOMContentLoaded',init); }
})();
